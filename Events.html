<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>College Events – Govt. Degree College Majeed SRE</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-storage-compat.js"></script>
    <style>
        .eh {
            position: sticky;
            top: 0;
            z-index: 50;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            padding: 10px 4%;
            background: #0b1f3acc;
            backdrop-filter: blur(14px);
            color: #fff;
            border-bottom: 2px solid var(--teal)
        }

        .eh b {
            font-size: .95rem
        }

        .eh .btn {
            padding: 7px 14px;
            background: rgba(255, 255, 255, .16) !important;
            color: #fff !important;
            white-space: nowrap
        }

        .ebanner {
            position: relative;
            overflow: hidden;
            text-align: center;
            color: #fff;
            padding: 70px 18px 56px;
            background: linear-gradient(135deg, #7c3aed, #0ea5a4, #f59e0b);
            background-size: 220% 220%;
            animation: gr 10s infinite
        }

        @keyframes gr {
            50% {
                background-position: 100% 50%
            }
        }

        .ebanner h1 {
            font-size: clamp(2rem, 6vw, 3.2rem);
            color: #fff;
            text-shadow: 0 4px 20px #0005;
            margin: 0 0 8px;
            animation: up .8s both
        }

        .ebanner p {
            max-width: 560px;
            margin: 0 auto 16px;
            opacity: .95;
            animation: up .8s .15s both
        }

        .fl {
            position: absolute;
            font-size: 30px;
            opacity: .85;
            animation: fl 6s ease-in-out infinite
        }

        @keyframes fl {
            50% {
                transform: translateY(-24px) rotate(14deg)
            }
        }

        .ebanner .pill {
            background: #fff3;
            color: #fff;
            border-color: #fff6
        }

        .wrap {
            max-width: 1150px;
            margin: 0 auto;
            padding: 24px 16px 60px
        }

        details.sec {
            width: 100%;
            margin: 0 0 10px;
            padding: 16px 20px
        }

        details summary {
            cursor: pointer;
            font-weight: 800;
            color: var(--pri);
            font-size: 1.05rem
        }

        .chips {
            display: flex;
            gap: 8px;
            justify-content: center;
            margin: 18px 0 26px;
            flex-wrap: wrap
        }

        [data-theme] .chip {
            background: var(--card);
            color: var(--text);
            border: 1px solid var(--bd);
            border-radius: 22px;
            padding: 8px 20px;
            box-shadow: none
        }

        [data-theme] .chip.on {
            background: linear-gradient(135deg, #7c3aed, #0ea5a4);
            color: #fff;
            border-color: transparent
        }

        .egrid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(min(270px, 100%), 1fr));
            gap: 22px
        }

        .ecard {
            background: var(--card);
            border: 1px solid var(--bd);
            border-radius: 18px;
            overflow: hidden;
            cursor: pointer;
            box-shadow: var(--sh);
            transition: .35s;
            animation: up .6s both
        }

        .ecard:hover {
            transform: translateY(-8px);
            box-shadow: 0 18px 40px #7c3aed38
        }

        .thw {
            position: relative;
            overflow: hidden
        }

        .thw .th {
            transition: transform .5s
        }

        .ecard:hover .th {
            transform: scale(1.07)
        }

        .ecard:hover .play {
            transform: scale(1.15);
            background: #7c3aedcc
        }

        .badge {
            position: absolute;
            top: 10px;
            left: 10px;
            background: #000b;
            color: #fff;
            font-size: 11px;
            font-weight: 700;
            padding: 4px 10px;
            border-radius: 12px
        }

        .cb {
            padding: 14px
        }

        .cb h3 {
            margin: 0 0 4px;
            font-size: 1.05rem;
            color: var(--text)
        }

        .mt {
            display: flex;
            gap: 16px;
            margin-top: 10px;
            color: var(--mut);
            font-size: 14px
        }

        .empty {
            grid-column: 1/-1;
            text-align: center;
            padding: 60px 10px;
            font-size: 1.1rem;
            color: var(--mut)
        }

        #evView>div {
            max-width: 800px;
            padding: 0;
            position: relative
        }

        #evView video,
        #evView img.big {
            display: block;
            width: 100%;
            max-height: 60vh;
            object-fit: contain;
            background: #000
        }

        .vid {
            position: relative;
            padding-top: 56.25%;
            background: #000
        }

        .vid iframe {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            border: 0
        }

        .vb {
            padding: 18px
        }

        .vx {
            position: absolute;
            top: 10px;
            right: 10px;
            z-index: 3;
            width: 38px;
            height: 38px;
            border-radius: 50%;
            padding: 0 !important;
            min-height: 0 !important;
            background: #000b !important;
            color: #fff !important
        }

        .act {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin: 12px 0
        }

        [data-theme] .act button.ab {
            background: var(--card);
            color: var(--text);
            border: 1px solid var(--bd);
            padding: 8px 16px;
            border-radius: 22px;
            font-size: 14px;
            min-height: 0;
            box-shadow: none
        }

        [data-theme] .act button.ab:hover {
            border-color: var(--teal);
            transform: translateY(-2px)
        }

        [data-theme] .act button.ab.liked {
            border-color: #ef4444;
            color: #ef4444
        }

        .cm {
            padding: 8px 10px;
            margin-bottom: 6px;
            background: var(--in);
            border-radius: 8px;
            font-size: 14px
        }

        .cm small {
            color: var(--mut)
        }
    </style>
</head>

<body>
    <header class="eh"><a class="btn" id="back" href="index.html">← Portal</a><b>🎓 Govt. Degree College Majeed
            SRE</b><button class="tbtn" id="theme" type="button"></button></header>
    <section class="ebanner"><span class="fl" style="left:6%;top:18%">🎉</span><span class="fl"
            style="left:18%;top:62%;animation-delay:1s">🎈</span><span class="fl"
            style="right:8%;top:20%;animation-delay:2s">✨</span><span class="fl"
            style="right:20%;top:64%;animation-delay:.5s">🏆</span><span class="fl"
            style="left:48%;top:8%;animation-delay:3s">🎊</span>
        <h1>🎉 College Events</h1>
        <p>Hamare college ki yaadgaar videos aur tasveerein — dekhein, like karein, comment karein aur share karein.</p>
        <span class="pill" id="stat">Loading...</span>
    </section>
    <main class="wrap">
        <details class="sec hid" id="admin">
            <summary>➕ Add New Event (Admin)</summary>
            <div style="margin-top:14px"><input id="evT" placeholder="Event title" maxlength="80"><textarea id="evD"
                    rows="3" placeholder="Event description..." maxlength="500"></textarea><select id="evMode">
                    <option value="yt">Video link (YouTube / Facebook)</option>
                    <option value="file" selected>⬆️ Upload photo / video file</option>
                </select><input id="evUrl" placeholder="YouTube ya Facebook video ka link paste karein"
                    class="hid"><input id="evFile" type="file" accept="video/*,image/*">
                <p id="evProg" style="font-size:13px;color:var(--mut);margin-bottom:8px"></p><button class="green"
                    id="evPub">🚀 Publish Event</button>
            </div>
        </details>
        <div class="chips"><button class="chip on" data-f="all">✨ All</button><button class="chip" data-f="video">🎬
                Videos</button><button class="chip" data-f="image">📷 Photos</button></div>
        <div class="egrid" id="egrid"></div>
    </main>
    <div class="mod" id="evView">
        <div><button class="vx" data-close aria-label="Close">✕</button>
            <div id="vBody"></div>
        </div>
    </div>
    <div class="mod" id="mWarn">
        <div style="text-align:center;border:2px solid #ef4444">
            <div style="font-size:50px">🚫</div>
            <h3 style="color:#ef4444;margin:6px 0">Yeh nahi ho sakta!</h3>
            <p id="warnMsg" style="font-weight:700;margin-bottom:12px"></p><button class="red" data-close>Theek
                hai</button>
        </div>
    </div>
    <script src="data.js"></script>
    <script>
        const $ = i => document.getElementById(i), vid = getVid(), toast = m => alert(m), q = isAdmin ? 'maryam=imran' : '';
        const yt = u => (u.match(/(?:youtu\.be\/|v=|embed\/|shorts\/)([\w-]{11})/) || [])[1], isVid = e => e.type !== 'image';
        let EV = [], LK = {}, CM = {}, F = 'all', cur = null, lastC = 0, first = true;
        $('back').href = 'index.html' + (q ? '?' + q : '');
        const setTheme = t => { document.documentElement.dataset.theme = t; localStorage.setItem('theme', t); $('theme').textContent = t === 'dark' ? '☀️ Light' : '🌙 Dark' }; setTheme(document.documentElement.dataset.theme);
        $('theme').onclick = () => setTheme(document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark');
        $('admin').classList.toggle('hid', !isAdmin);
        $('evMode').onchange = () => { const f = $('evMode').value === 'file'; $('evUrl').classList.toggle('hid', f); $('evFile').classList.toggle('hid', !f) };
        document.querySelectorAll('.chip').forEach(c => c.onclick = () => { F = c.dataset.f; document.querySelectorAll('.chip').forEach(x => x.classList.toggle('on', x === c)); renderGrid() });
        const media = e => e.type === 'facebook' ? `<div class="vid"><iframe src="https://www.facebook.com/plugins/video.php?href=${encodeURIComponent(e.fbUrl)}&show_text=false" allowfullscreen allow="encrypted-media;picture-in-picture;web-share"></iframe></div>` : e.type === 'youtube' ? `<div class="vid"><iframe src="https://www.youtube.com/embed/${esc(e.ytId)}?rel=0" allowfullscreen allow="encrypted-media;picture-in-picture"></iframe></div>` : e.type === 'video' ? `<video src="${esc(e.url)}" ${e.orig ? `data-o="${esc(e.orig)}"` : ''} controls playsinline autoplay onerror="vErr(this)"></video>` : `<img class="big" src="${esc(e.url)}" alt="">`;
        function renderGrid() {
            const a = EV.filter(e => F === 'all' || (F === 'video' ? isVid(e) : !isVid(e)));
            $('stat').textContent = `🎬 ${EV.filter(isVid).length} Videos  •  📷 ${EV.filter(e => !isVid(e)).length} Photos`;
            $('egrid').innerHTML = a.length ? a.map((e, i) => `<article class="ecard" data-open="${e.id}" style="animation-delay:${Math.min(i, 8) * .07}s"><div class="thw"><div class="th" style="${thumb(e) ? `background-image:url('${esc(thumb(e))}')` : ''}"></div>${isVid(e) ? '<span class="play">▶</span>' : ''}<span class="badge">${isVid(e) ? '🎬 VIDEO' : '📷 PHOTO'}</span></div><div class="cb"><h3>${esc(e.title)}</h3><small style="color:var(--mut)">📅 ${esc(new Date(e.createdAt).toLocaleDateString())}</small><div class="mt"><span>❤️ <b id="gl-${e.id}">0</b></span><span>💬 <b id="gc-${e.id}">0</b></span><span>↗ Share</span></div></div></article>`).join('') : '<div class="empty">🎈<br>Abhi is category mein koi event nahi hai</div>'; updCounts()
        }
        function updCounts() { EV.forEach(e => { const l = $('gl-' + e.id), c = $('gc-' + e.id); if (l) l.textContent = Object.keys(LK[e.id] || {}).length; if (c) c.textContent = Object.keys(CM[e.id] || {}).length }) }
        function updLikes(id) { const l = LK[id] || {}, n = $('lk-' + id); if (!n) return; n.textContent = Object.keys(l).length; const on = !!l[vid]; $('li-' + id).textContent = on ? '❤️' : '🤍'; n.closest('button').classList.toggle('liked', on) }
        function updComments(id) {
            const a = Object.entries(CM[id] || {}).sort((x, y) => x[1].at - y[1].at), l = $('cl-' + id), n = $('cc-' + id); if (n) n.textContent = a.length;
            if (l) l.innerHTML = a.length ? a.map(([k, v]) => `<div class="cm"><b>${esc(v.name)}</b> <small>${esc(new Date(v.at).toLocaleString())}</small>${isAdmin ? ` <a href="#" data-dc="${id}|${k}" style="color:#ef4444">✕</a>` : ''}<br>${esc(v.text)}</div>`).join('') : '<small style="color:var(--mut)">Pehla comment aap karein 💬</small>'
        }
        function openView(id) {
            const e = EV.find(x => x.id === id); if (!e) return; cur = id; history.replaceState(null, '', '?event=' + id + (q ? '&' + q : ''));
            $('vBody').innerHTML = `${media(e)}<div class="vb"><h2 style="margin:0 0 4px;font-size:1.4rem">${esc(e.title)}</h2><small style="color:var(--mut)">📅 ${esc(new Date(e.createdAt).toLocaleDateString())}</small><p style="margin:10px 0;white-space:pre-line">${esc(e.desc)}</p>
<div class="act"><button class="ab" data-like="${id}"><span id="li-${id}">🤍</span> <b id="lk-${id}">0</b> Like</button><button class="ab" data-sh="${id}">↗ Share</button><button class="ab" disabled style="opacity:1">💬 <b id="cc-${id}">0</b></button>${isAdmin ? `<button class="ab" style="color:#ef4444!important" data-del="${id}">🗑️ Delete</button>` : ''}</div>
<h3 style="margin:8px 0">💬 Comments</h3><div id="cl-${id}" style="margin-bottom:10px"></div><input class="cn" placeholder="Your name" maxlength="30" value="${esc(localStorage.cname || '')}"><input class="ct" placeholder="Write a comment..." maxlength="200"><button data-post="${id}">Post Comment</button></div>`;
            $('evView').classList.add('on'); updLikes(id); updComments(id)
        }
        function closeView() { $('evView').classList.remove('on'); $('vBody').innerHTML = ''; cur = null; history.replaceState(null, '', location.pathname + (q ? '?' + q : '')) }
        document.querySelectorAll('.mod').forEach(m => m.onclick = e => { if (e.target === m || e.target.closest('[data-close]')) m.id === 'evView' ? closeView() : m.classList.remove('on') });
        const warn = w => { $('warnMsg').textContent = w; $('mWarn').classList.add('on') };
        async function share(id) {
            const e = EV.find(x => x.id === id), url = location.href.split(/[?#]/)[0] + '?event=' + id;
            if (navigator.share) { try { await navigator.share({ title: e.title, text: e.title + ' – Govt. Degree College Majeed SRE', url }); return } catch (x) { if (x.name === 'AbortError') return } }
            try { await navigator.clipboard.writeText(url); toast('🔗 Event ka link copy ho gaya!') } catch (x) { prompt('Link copy karein:', url) }
        }
        $('egrid').onclick = e => { const c = e.target.closest('[data-open]'); if (c) openView(c.dataset.open) };
        $('vBody').addEventListener('click', async ev => {
            const t = ev.target.closest('[data-like],[data-sh],[data-del],[data-post],[data-dc]'); if (!t) return; ev.preventDefault(); const D = t.dataset;
            if (D.like) { const r = db.ref('event_likes/' + D.like + '/' + vid); (LK[D.like] || {})[vid] ? r.remove() : r.set(true) }
            else if (D.sh) share(D.sh);
            else if (D.del) { if (isAdmin && confirm('Is event ko delete karna hai?')) { const i = D.del; closeView(); db.ref('events/' + i).remove(); db.ref('event_likes/' + i).remove(); db.ref('event_comments/' + i).remove() } }
            else if (D.dc) { if (isAdmin) { const [i, k] = D.dc.split('|'); db.ref('event_comments/' + i + '/' + k).remove() } }
            else if (D.post) {
                const box = $('vBody'), name = box.querySelector('.cn').value.trim(), tx = box.querySelector('.ct'), text = tx.value.trim();
                if (!name || !text) return toast('Naam aur comment dono likhein.');
                if (abusive(name + ' ' + text) || /(https?:\/\/|www\.)/i.test(text)) return warn('Gali galoch, links ya bad-tameezi wala comment nahi ho sakta.');
                if (Date.now() - lastC < 10000) return toast('Thora ruk kar dobara comment karein.');
                lastC = Date.now(); localStorage.cname = name; try { await db.ref('event_comments/' + D.post).push({ name, text, at: Date.now() }); tx.value = '' } catch (e) { toast('Comment nahi hua: ' + e.message) }
            }
        });
        const cloudUpload = (f, onp) => new Promise((ok, no) => { const x = new XMLHttpRequest(), fd = new FormData(); fd.append('file', f); fd.append('upload_preset', CLOUDINARY.preset); x.open('POST', `https://api.cloudinary.com/v1_1/${CLOUDINARY.cloud}/video/upload`); x.upload.onprogress = e => e.lengthComputable && onp(Math.round(e.loaded / e.total * 100)); x.onload = () => { try { const r = JSON.parse(x.responseText); x.status < 300 && r.secure_url ? ok(r.secure_url) : no(new Error((r.error && r.error.message) || 'Upload fail')) } catch (e) { no(e) } }; x.onerror = () => no(new Error('Network error')); x.send(fd) });
        function vErr(v) { if (v.dataset.o && v.src !== v.dataset.o) { v.src = v.dataset.o; return } if (!v.nextElementSibling || !v.nextElementSibling.classList.contains('verr')) { const p = document.createElement('p'); p.className = 'verr'; p.style.cssText = 'padding:14px;color:#ef4444;font-weight:700'; p.textContent = 'Video load nahi hui. Admin se dobara upload karwayein.'; v.after(p) } }
        const compressImg = f => new Promise((ok, no) => { const im = new Image(), u = URL.createObjectURL(f); im.onload = () => { const k = Math.min(1, 1000 / Math.max(im.width, im.height)), c = document.createElement('canvas'); c.width = Math.round(im.width * k); c.height = Math.round(im.height * k); c.getContext('2d').drawImage(im, 0, 0, c.width, c.height); URL.revokeObjectURL(u); ok(c.toDataURL('image/jpeg', .72)) }; im.onerror = () => no(new Error('Photo load nahi hui')); im.src = u });
        $('evPub').onclick = async () => {
            if (!isAdmin) return; const t = $('evT').value.trim(), d = $('evD').value.trim(), b = $('evPub'); if (!t) return toast('Event ka title likhein.');
            const rec = { title: t, desc: d, createdAt: Date.now() }; b.disabled = true;
            try {
                if ($('evMode').value === 'yt') { const u = $('evUrl').value.trim(), id = yt(u); if (id) { rec.type = 'youtube'; rec.ytId = id } else if (/^https?:\/\/([\w-]+\.)?(facebook\.com|fb\.watch|fb\.com)\//i.test(u)) { rec.type = 'facebook'; rec.fbUrl = u } else return toast('Sahi YouTube ya Facebook video ka link daalein.') }
                else {
                    const f = $('evFile').files[0]; if (!f) return toast('Pehle photo ya video chunein.');
                    if (f.type.startsWith('image')) { $('evProg').textContent = 'Photo process ho rahi hai...'; rec.url = await compressImg(f); rec.type = 'image' }
                    else {
                        const cl = CLOUDINARY.cloud && CLOUDINARY.preset, mb = cl ? 100 : 60; if (!cl) toast('Dhyan dein: data.js mein Cloudinary ki cloud aur preset values abhi khali hain, isliye video upload nahi hogi.'); if (f.size > mb * 1024 * 1024) return toast('Video ' + mb + 'MB se choti honi chahiye.');
                        if (cl) { const u = await cloudUpload(f, p => $('evProg').textContent = 'Uploading ' + p + '%'); rec.orig = u; rec.url = u.replace('/upload/', '/upload/f_mp4,q_auto/').replace(/\.[a-z0-9]+$/i, '.mp4'); rec.type = 'video' }
                        else {
                            if (!firebase.storage) throw new Error('Video hosting setup nahi hai.');
                            const r = firebase.storage().ref('events/' + Date.now() + '_' + f.name.replace(/[^\w.-]/g, '_')), task = r.put(f);
                            await new Promise((ok, no) => {
                                let last = 0; const wd = setTimeout(() => { if (!last) { task.cancel(); no(new Error('Video upload shuru nahi hua. data.js mein Cloudinary ki settings daalein.')) } }, 15000);
                                task.on('state_changed', x => { last = x.bytesTransferred; $('evProg').textContent = 'Uploading ' + Math.round(x.bytesTransferred / x.totalBytes * 100) + '%' }, e => { clearTimeout(wd); no(e) }, () => { clearTimeout(wd); ok() })
                            });
                            rec.url = await r.getDownloadURL(); rec.type = 'video'
                        }
                    }
                }
                await db.ref('events').push(rec); toast('Event publish ho gaya 🎉'); $('evT').value = $('evD').value = $('evUrl').value = $('evFile').value = $('evProg').textContent = ''; $('admin').open = false
            }
            catch (e) { toast('Upload fail: ' + e.message + '\n\nPhoto seedhi upload hoti hai. Video ke liye data.js mein Cloudinary ki settings zaroori hain.'); $('evProg').textContent = '' } finally { b.disabled = false }
        };
        db.ref('events').on('value', s => {
            EV = []; s.forEach(c => { EV.push({ id: c.key, ...c.val() }) }); EV.sort((a, b) => b.createdAt - a.createdAt); renderGrid();
            if (first) { first = false; const id = new URLSearchParams(location.search).get('event'); if (id) openView(id) }
        });
        db.ref('event_likes').on('value', s => { LK = s.val() || {}; updCounts(); if (cur) updLikes(cur) });
        db.ref('event_comments').on('value', s => { CM = s.val() || {}; updCounts(); if (cur) updComments(cur) });
    </script>
</body>

</html>
